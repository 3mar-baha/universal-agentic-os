name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  upload:
    name: Attach release artifact
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Package release tarball
        run: |
          set -e
          tar -czf "universal-agentic-os-${GITHUB_REF_NAME}.tar.gz" \
            CLAUDE.md AGENTS.md CHANGELOG.md CONTRIBUTING.md LICENSE README.md README.ar.md \
            vantrilex.ps1 \
            .editorconfig .gitattributes .gitignore .env.example .markdownlint.jsonc \
            .mcp.json docs skills scripts .claude .githooks .github .devcontainer

      - name: Upload artifact onto the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # Self-healing: if the tag landed before its release was created,
          # create it first so the upload always has a target.
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
              --notes "See CHANGELOG.md for this version's change set."
          gh release upload "$GITHUB_REF_NAME" \
            "universal-agentic-os-${GITHUB_REF_NAME}.tar.gz" --clobber
          echo "artifact attached to ${GITHUB_REF_NAME}"
